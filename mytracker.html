<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>My Trackers - PriceBloomBuddy</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-variant": "#d3e4fe",
            "on-surface-variant": "#3d4a3d",
            "surface-bright": "#f8f9ff",
            "secondary-fixed-dim": "#bcc7de",
            "on-secondary": "#ffffff",
            "on-tertiary-container": "#2623b8",
            "on-tertiary-fixed-variant": "#2f2ebe",
            "inverse-surface": "#213145",
            "on-primary-container": "#004b1e",
            "primary-fixed-dim": "#4ae176",
            "surface-container": "#e5eeff",
            "surface-container-lowest": "#ffffff",
            "secondary": "#545f73",
            "on-background": "#0b1c30",
            "on-primary-fixed-variant": "#005321",
            "on-primary-fixed": "#002109",
            "on-error": "#ffffff",
            "on-error-container": "#93000a",
            "surface-container-high": "#dce9ff",
            "outline": "#6d7b6c",
            "on-tertiary-fixed": "#07006c",
            "error": "#ba1a1a",
            "on-primary": "#ffffff",
            "surface-container-highest": "#d3e4fe",
            "primary": "#006e2f",
            "primary-fixed": "#6bff8f",
            "on-secondary-container": "#586377",
            "tertiary-container": "#a1a3ff",
            "error-container": "#ffdad6",
            "secondary-container": "#d5e0f8",
            "surface-tint": "#006e2f",
            "tertiary-fixed": "#e1e0ff",
            "inverse-primary": "#4ae176",
            "primary-container": "#22c55e",
            "on-surface": "#0b1c30",
            "surface-container-low": "#eff4ff",
            "tertiary": "#494bd6",
            "surface": "#f8f9ff",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#d8e3fb",
            "background": "#f8f9ff",
            "outline-variant": "#bccbb9",
            "surface-dim": "#cbdbf5",
            "inverse-on-surface": "#eaf1ff",
            "on-secondary-fixed": "#111c2d",
            "on-secondary-fixed-variant": "#3c475a"
          },
          "spacing": {
            "stack-lg": "24px",
            "stack-md": "16px",
            "stack-sm": "8px",
            "stack-xs": "4px",
            "gutter": "24px",
            "stack-xl": "48px",
            "margin-mobile": "16px",
            "margin-desktop": "32px",
            "container-max": "1280px"
          },
          "fontSize": {
            "h1": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "h2": ["32px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "h3": ["24px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}],
            "body-lg": ["18px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
            "body-md": ["16px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
            "body-sm": ["14px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}],
            "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600"}],
            "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body { font-family: 'Inter', sans-serif; }
    .toast-notification {
      animation: slideInRight 0.3s ease-out forwards;
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast-notification.hide {
      animation: fadeOut 0.3s ease-out forwards;
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(30px); visibility: hidden; }
    }
  </style>
</head>
<body class="bg-background text-on-background">

<!-- Toast Container -->
<div id="toast-container" class="fixed top-20 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full"></div>

<!-- TopNavBar -->
<nav class="bg-surface/90 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/30 shadow-sm">
  <div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-stack-sm max-w-container-max mx-auto">
    <div class="flex items-center gap-gutter">
      <button id="nav-home" class="font-h2 text-h2 font-bold text-primary tracking-tight hover:opacity-90 transition-opacity cursor-pointer">PriceBloomBuddy</button>
      <div class="hidden md:flex items-center gap-stack-lg">
        <button id="nav-dashboard" class="text-secondary font-medium hover:text-primary transition-colors cursor-pointer">Dashboard</button>
        <button id="nav-trackers" class="text-secondary font-medium hover:text-primary transition-colors cursor-pointer">Trackers</button>
        <button id="nav-pricing" class="text-secondary font-medium hover:text-primary transition-colors cursor-pointer">Pricing</button>
      </div>
    </div>
    <div class="flex items-center gap-stack-md">
      <button id="add-link-btn" class="hidden md:flex items-center gap-stack-xs bg-primary text-on-primary px-stack-md py-stack-sm rounded-lg font-label-md hover:bg-primary/90 transition-all active:scale-95 cursor-pointer"><span class="material-symbols-outlined">add</span>Add Link</button>
      <div class="flex gap-stack-sm text-secondary">
        <button id="notifications-btn" class="flex items-center justify-center text-inherit hover:bg-surface-container-low transition-all rounded-full cursor-pointer">
          <span class="material-symbols-outlined p-stack-sm">notifications</span>
        </button>
        <div class="relative">
          <button id="account-menu-btn" class="flex items-center justify-center text-inherit hover:bg-surface-container-low transition-all rounded-full cursor-pointer">
            <button id="auth-nav-btn" class="flex items-center justify-center gap-stack-xs bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md hover:bg-primary/90 transition-all active:scale-95 cursor-pointer">
              <span class="material-symbols-outlined text-[20px]">account_circle</span>
              <span id="auth-nav-text">Sign In</span>
            </button>
          </button>
          <div id="account-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-surface rounded-xl shadow-lg border border-outline-variant/30 z-50 overflow-hidden">
            <div id="dropdown-loggedout-view" class="py-2">
              <button id="login-dropdown-btn" class="w-full text-left px-4 py-2 text-sm text-on-background hover:bg-surface-container-low transition-colors font-medium cursor-pointer">Sign In</button>
              <button id="signup-dropdown-btn" class="w-full text-left px-4 py-2 text-sm text-on-background hover:bg-surface-container-low transition-colors font-medium cursor-pointer">Create Account</button>
            </div>
            <div id="dropdown-loggedin-view" class="hidden py-2">
              <div class="px-4 py-2 text-sm font-semibold text-primary border-b border-outline-variant/20" id="dropdown-user-email">user@example.com</div>
              <button id="myprofile-dropdown-btn" class="w-full text-left px-4 py-2 text-sm text-on-background hover:bg-surface-container-low transition-colors cursor-pointer">My Profile</button>
              <button id="logout-dropdown-btn" class="w-full text-left px-4 py-2 text-sm text-error hover:bg-surface-container-low transition-colors cursor-pointer">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="px-margin-mobile md:px-margin-desktop py-stack-lg max-w-container-max mx-auto">
  <div class="flex justify-between items-center mb-stack-xl">
    <h1 class="font-h1 text-h1 text-on-background">My Trackers</h1>
    <button id="add-tracker-btn" class="bg-primary text-on-primary px-stack-lg py-stack-sm rounded-lg font-label-md hover:bg-primary/90 transition-all active:scale-95 cursor-pointer flex items-center gap-stack-xs"><span class="material-symbols-outlined">add</span>Add Tracker</button>
  </div>
  
  <!-- Trackers List -->
  <div class="space-y-stack-md">
    <div class="bg-surface-container rounded-xl p-stack-lg border border-outline-variant/20 hover:shadow-md transition-shadow">
      <div class="flex justify-between items-start mb-stack-md">
        <div class="flex gap-stack-md flex-1">
          <img alt="Product" class="w-16 h-16 rounded-lg object-cover" src="https://via.placeholder.com/64"/>
          <div class="flex-1">
            <h3 class="font-h3 text-h3 text-on-background">Sony WH-1000XM5 Headphones</h3>
            <p class="font-body-sm text-secondary">Amazon | Target: ₹25,999</p>
            <div class="flex gap-stack-md mt-stack-sm">
              <span class="px-stack-sm py-1 bg-primary/10 rounded-full font-label-sm text-primary">-15% Drop</span>
              <span class="px-stack-sm py-1 bg-success/10 rounded-full font-label-sm text-success">Saved ₹4,000</span>
            </div>
          </div>
        </div>
        <button class="text-error hover:bg-error/10 transition-colors rounded-lg p-stack-sm cursor-pointer">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
      <div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
        <div class="bg-primary h-full w-[70%] rounded-full"></div>
      </div>
      <div class="flex justify-between mt-stack-sm text-label-sm text-secondary">
        <span>Current: ₹21,999</span>
        <span>70% to target</span>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-surface-container-highest w-full py-stack-xl mt-stack-xl border-t border-outline-variant/20">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto text-center md:text-left">
    <div><button id="footer-home" class="font-h3 text-h3 font-bold text-primary block mb-stack-sm hover:opacity-90 transition-opacity cursor-pointer">PriceBloomBuddy</button><p class="font-body-sm text-secondary">The world's most intelligent price tracker for the modern consumer.</p></div>
    <div class="flex flex-col gap-stack-sm"><h5 class="font-label-md text-on-surface">Quick Links</h5><button id="footer-dashboard" class="font-body-sm text-secondary text-left cursor-pointer hover:text-primary">Dashboard</button><button id="footer-trackers" class="font-body-sm text-secondary text-left cursor-pointer hover:text-primary">Trackers</button><button id="footer-pricing" class="font-body-sm text-secondary text-left cursor-pointer hover:text-primary">Pricing</button></div>
    <div class="flex flex-col justify-between"><div class="flex justify-center md:justify-end gap-stack-md"><span class="material-symbols-outlined text-secondary cursor-pointer hover:text-primary">language</span><span class="material-symbols-outlined text-secondary cursor-pointer hover:text-primary">rss_feed</span><span class="material-symbols-outlined text-secondary cursor-pointer hover:text-primary">share</span></div><p class="font-label-sm text-secondary mt-stack-md">© 2024 PriceBloomBuddy. Grow your savings.</p></div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  // Protect this page - user must be logged in
  document.addEventListener('DOMContentLoaded', () => {
    if (!currentUser) {
      showToast('Please sign in to view trackers', 'error');
      setTimeout(() => window.location.href = 'createaccout.html', 1000);
    }
    
    // Add tracker button
    document.getElementById('add-tracker-btn')?.addEventListener('click', () => {
      window.location.href = 'addtracker.html';
    });
  });
</script>
</body>
</html>
